[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_package"
dynamic = ["version"]
authors = [
    { name = "Ekaterina Kumanina", email = "katenizm@gmail.com" },
]
description = "Urban blocks, density, accessibility and school provision metrics for Irkutsk"
readme = "README.rst"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["urban planning", "GIS", "OpenStreetMap", "BlocksNet", "Irkutsk"]

dependencies = [
    "geopandas>=1.0.0,<2.0.0",
    "blocksnet[ipynb,torch]==1.0.0.a9",
    "osmnx>=2.0.0",
    "folium>=0.14.0",
    "matplotlib>=3.7",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[tool.setuptools.packages.find]
include = ["my_package*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[project.optional-dependencies]
dev = [
    "black[jupyter]==22.3",     # Форматирование, включая поддержку Jupyter
    "mapclassify==2.6.1",       # Визуализация данных в Jupyter
    "folium==0.14.0",           # Карты для Jupyter
    "matplotlib-inline==0.1.6", # Встроенные графики в Jupyter
    "ipykernel",                # Ядро для работы в Jupyter
    "jupyter",                  # Jupyter Notebook
    "ipywidgets",               # Виджеты для интерактивных элементов
    "isort==5.10.1",            # Сортировка импортов
    "pylint==2.17.5",           # Линтинг
    "pre-commit>=3.1",          # Интеграция хуков для автоформатирования
    "build",                    # Сборка пакета для публикации
    "twine",                    # Публикация пакета на PyPI
]

tests = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
]

docs = [
    "docutils>=0.18.0,<1.0.0",
    "sphinx==6.2.1",
    "sphinx-book-theme==1.0.1",
    "nbsphinx==0.9.3",
    "nbsphinx-link==1.3.0",
    "numpydoc==1.5.0",
    "autodocsumm==0.2.12",
    "myst_parser>=3.0.0,<4.0.0",
    "sphinx_rtd_theme>=1.2.0,<2.0.0",
    "pandoc>=2.0.0,<3.0.0",
]


# форматирование и линтинг
[tool.black]
line-length = 120
target-version = ['py310']

[tool.pylint.format]
max-line-length = 120
expected-line-ending-format = "LF"

[tool.pylint.main]
extension-pkg-allow-list = ["pydantic"]

[tool.pycodestyle]
max-line-length = 120


[tool.isort]
lines_after_imports = 2
multi_line_output = 3
line_length = 120
include_trailing_comma = true
